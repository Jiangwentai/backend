services:
  questdb:
    image: questdb/questdb:9.4.3
    ports:
      - "${QDB_HTTP_PORT:-9000}:9000"
      - "${QDB_PG_PORT:-8812}:8812"
      - "${QDB_METRICS_PORT:-9003}:9003"
    volumes:
      - questdb-data:/var/lib/questdb
    healthcheck:
      test: ["CMD", "curl", "-fsSG", "--data-urlencode", "query=SELECT 1", "http://localhost:9000/exec"]
      interval: 2s
      timeout: 2s
      retries: 30
  questdb-init:
    image: curlimages/curl:8.15.0
    depends_on:
      questdb:
        condition: service_healthy
    volumes:
      - ./sql/questdb:/schema:ro
    entrypoint: ["/bin/sh", "-ec"]
    command: ["for file in /schema/*.sql; do curl -fsS -G --data-urlencode query@$$file http://questdb:9000/exec; done"]
    restart: "no"
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-market_data}
      POSTGRES_USER: ${POSTGRES_USER:-market_data}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-password}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/postgresql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      ZMQ_SUB_ENDPOINT: ${ZMQ_SUB_ENDPOINT:-tcp://host.docker.internal:5556}
      QDB_HTTP_URL: http://questdb:9000
      WEBSOCKET_QUEUE_CAPACITY: ${WEBSOCKET_QUEUE_CAPACITY:-128}
      LIVE_STALE_AFTER_SECONDS: ${LIVE_STALE_AFTER_SECONDS:-5}
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-market_data}:${POSTGRES_PASSWORD:-dev-only-password}@postgres:5432/${POSTGRES_DB:-market_data}
      ARCHIVE_ROOT: /archive
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["${API_PORT:-8000}:8000"]
    volumes:
      - archive-data:/archive:ro
    depends_on:
      questdb-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
  archive:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles: ["tools"]
    entrypoint: ["python", "-m", "archive.cli"]
    environment:
      QDB_HTTP_URL: http://questdb:9000
      ARCHIVE_ROOT: /archive
    volumes:
      - archive-data:/archive
    depends_on:
      questdb-init:
        condition: service_completed_successfully
  research:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles: ["tools"]
    entrypoint: ["python", "-m", "research.cli"]
    environment:
      ARCHIVE_ROOT: /archive
    volumes:
      - archive-data:/archive:ro
  quality:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles: ["tools"]
    entrypoint: ["python", "-m", "quality.cli"]
    environment:
      ARCHIVE_ROOT: /archive
    volumes:
      - archive-data:/archive:ro
volumes:
  questdb-data:
  postgres-data:
  archive-data:
