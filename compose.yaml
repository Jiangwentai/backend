services:
  questdb:
    image: questdb/questdb:9.4.3
    ports:
      - "${QDB_HTTP_PORT:-9000}:9000"
      - "${QDB_PG_PORT:-8812}:8812"
      - "${QDB_METRICS_PORT:-9003}:9003"
    volumes:
      - questdb-data:/var/lib/questdb
    healthcheck:
      test: ["CMD", "curl", "-fsSG", "--data-urlencode", "query=SELECT 1", "http://localhost:9000/exec"]
      interval: 2s
      timeout: 2s
      retries: 30
  questdb-init:
    image: curlimages/curl:8.15.0
    depends_on:
      questdb:
        condition: service_healthy
    volumes:
      - ./sql/questdb:/schema:ro
    entrypoint: ["/bin/sh", "-ec"]
    command: ["for file in /schema/*.sql; do curl -fsS -G --data-urlencode query@$$file http://questdb:9000/exec; done"]
    restart: "no"
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-market_data}
      POSTGRES_USER: ${POSTGRES_USER:-market_data}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-password}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/postgresql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      ZMQ_SUB_ENDPOINT: ${ZMQ_SUB_ENDPOINT:-tcp://host.docker.internal:5556}
      AKSHARE_ZMQ_SUB_ENDPOINT: ${AKSHARE_ZMQ_SUB_ENDPOINT:-}
      AKSHARE_QUOTE_STALE_AFTER_SECONDS: ${AKSHARE_QUOTE_STALE_AFTER_SECONDS:-15}
      PROVIDER_SELECTION_MODE: ${PROVIDER_SELECTION_MODE:-explicit}
      PROVIDER_PREFERENCE: ${PROVIDER_PREFERENCE:-ctp,ibkr,synthetic,akshare}
      PROVIDER_FALLBACK_ENABLED: ${PROVIDER_FALLBACK_ENABLED:-false}
      PROVIDER_ALLOW_STALE: ${PROVIDER_ALLOW_STALE:-false}
      PROVIDER_DISCREPANCY_BPS: ${PROVIDER_DISCREPANCY_BPS:-20}
      QDB_HTTP_URL: http://questdb:9000
      WEBSOCKET_QUEUE_CAPACITY: ${WEBSOCKET_QUEUE_CAPACITY:-128}
      LIVE_STALE_AFTER_SECONDS: ${LIVE_STALE_AFTER_SECONDS:-5}
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-market_data}:${POSTGRES_PASSWORD:-dev-only-password}@postgres:5432/${POSTGRES_DB:-market_data}
      ARCHIVE_ROOT: /archive
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["${API_PORT:-8000}:8000"]
    volumes:
      - archive-data:/archive:ro
    depends_on:
      questdb-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
  archive:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles: ["tools"]
    entrypoint: ["python", "-m", "archive.cli"]
    environment:
      QDB_HTTP_URL: http://questdb:9000
      ARCHIVE_ROOT: /archive
    volumes:
      - archive-data:/archive
    depends_on:
      questdb-init:
        condition: service_completed_successfully
  research:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles: ["tools"]
    entrypoint: ["python", "-m", "research.cli"]
    environment:
      ARCHIVE_ROOT: /archive
    volumes:
      - archive-data:/archive:ro
  quality:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles: ["tools"]
    entrypoint: ["python", "-m", "quality.cli"]
    environment:
      ARCHIVE_ROOT: /archive
    volumes:
      - archive-data:/archive:ro
  akshare-worker:
    build:
      context: .
      dockerfile: docker/akshare.Dockerfile
    profiles: ["akshare"]
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-market_data}:${POSTGRES_PASSWORD:-dev-only-password}@postgres:5432/${POSTGRES_DB:-market_data}
      QDB_HTTP_URL: http://questdb:9000
      AKSHARE_RAW_ROOT: /raw
      AKSHARE_MAX_CONCURRENCY: ${AKSHARE_MAX_CONCURRENCY:-2}
      AKSHARE_MIN_INTERVAL_MS: ${AKSHARE_MIN_INTERVAL_MS:-500}
      AKSHARE_MAX_ATTEMPTS: ${AKSHARE_MAX_ATTEMPTS:-3}
      AKSHARE_SYMBOLS: ${AKSHARE_SYMBOLS:-}
      AKSHARE_DAILY_INTERVAL_SECONDS: ${AKSHARE_DAILY_INTERVAL_SECONDS:-86400}
    volumes:
      - akshare-raw-data:/raw
    depends_on:
      questdb-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["schedule"]
  akshare-quotes:
    build:
      context: .
      dockerfile: docker/akshare.Dockerfile
    profiles: ["akshare"]
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-market_data}:${POSTGRES_PASSWORD:-dev-only-password}@postgres:5432/${POSTGRES_DB:-market_data}
      QDB_HTTP_URL: http://questdb:9000
      AKSHARE_RAW_ROOT: /raw
      AKSHARE_REALTIME_ENABLED: ${AKSHARE_REALTIME_ENABLED:-false}
      AKSHARE_QUOTE_INSTRUMENTS: ${AKSHARE_QUOTE_INSTRUMENTS:-}
      AKSHARE_QUOTE_POLL_INTERVAL_SECONDS: ${AKSHARE_QUOTE_POLL_INTERVAL_SECONDS:-5}
      AKSHARE_QUOTE_REQUEST_TIMEOUT_SECONDS: ${AKSHARE_QUOTE_REQUEST_TIMEOUT_SECONDS:-10}
      AKSHARE_QUOTE_MAX_CONCURRENCY: ${AKSHARE_QUOTE_MAX_CONCURRENCY:-2}
      AKSHARE_QUOTE_BATCH_SIZE: ${AKSHARE_QUOTE_BATCH_SIZE:-20}
      AKSHARE_QUOTE_STALE_AFTER_SECONDS: ${AKSHARE_QUOTE_STALE_AFTER_SECONDS:-15}
      AKSHARE_REALTIME_PERSIST: ${AKSHARE_REALTIME_PERSIST:-false}
      AKSHARE_ZMQ_PUB_ENDPOINT: tcp://0.0.0.0:5557
      AKSHARE_MAX_CONCURRENCY: ${AKSHARE_QUOTE_MAX_CONCURRENCY:-2}
      AKSHARE_MIN_INTERVAL_MS: ${AKSHARE_MIN_INTERVAL_MS:-500}
      AKSHARE_MAX_ATTEMPTS: ${AKSHARE_MAX_ATTEMPTS:-3}
    ports: ["${AKSHARE_ZMQ_PORT:-5557}:5557"]
    volumes:
      - akshare-raw-data:/raw
    depends_on:
      postgres:
        condition: service_healthy
    command: ["serve-quotes"]
volumes:
  questdb-data:
  postgres-data:
  archive-data:
  akshare-raw-data:
